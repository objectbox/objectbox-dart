name: objectbox_mesh_sync
description: Fast Flutter database for persisting Dart objects. This package adds the Mesh Sync (peer-to-peer) network transport for ObjectBox Sync on Android, iOS and macOS.
# Link to actual directory in repository so file links on pub.dev work.
repository: https://github.com/objectbox/objectbox-dart/tree/main/objectbox_mesh_sync
homepage: https://objectbox.io
version: 6.0.0-preview.4

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # This is here just to ensure compatibility between objectbox-dart code and the libraries used
  # You should still depend on objectbox directly in your Flutter application.
  objectbox: 6.0.0-preview.4
  # Mesh Sync requires the Sync-enabled native libraries.
  objectbox_sync_flutter_libs: 6.0.0-preview.4

dev_dependencies:
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  # Only platforms with a mesh network implementation are listed.
  plugin:
    platforms:
      android:
        package: io.objectbox.objectbox_mesh_sync
        pluginClass: ObjectboxMeshSyncPlugin
      ios:
        pluginClass: ObjectboxMeshSyncPlugin
      macos:
        pluginClass: ObjectboxMeshSyncPlugin
