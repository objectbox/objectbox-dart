name: objectbox_test_app
description: "Flutter integration test runner for ObjectBox sync tests on Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  objectbox: any
  objectbox_sync_flutter_libs: any
  async: ^2.8.2
  path_provider: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ">=2.0.0 <2.15.0"
  objectbox_generator: any
  flutter_lints: ^6.0.0
  test: ^1.16.5

dependency_overrides:
  objectbox:
    path: ../objectbox
  objectbox_sync_flutter_libs:
    path: ../sync_flutter_libs
  objectbox_generator:
    path: ../generator

flutter:
  uses-material-design: true
